name: Hydrate Secrets

# Pushes locally-stored secrets to GitHub repo secrets.
# Designed to run on an ephemeral self-hosted runner started by
# automation/HydrateSecrets.ps1. The runner process inherits the
# secrets as environment variables; this workflow reads them and
# calls gh secret set using the runner's local gh auth.
#
# IMPORTANT: Do NOT set GH_TOKEN or GITHUB_TOKEN env overrides here.
# The workflow must use the runner operator's local gh CLI auth, which
# has the permissions needed for gh secret set. The default GITHUB_TOKEN
# does not have secrets:write scope.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Ephemeral runner label (set by HydrateSecrets.ps1)'
        required: true
        type: string

jobs:
  hydrate:
    name: Push secrets to GitHub
    runs-on: [self-hosted, '${{ github.event.inputs.runner_label }}']
    timeout-minutes: 5

    steps:
      - name: Verify secrets are available
        shell: bash
        run: |
          echo "Checking environment for secrets to hydrate..."
          FOUND=0
          MISSING=0

          for var in DISCORD_BOT_TOKEN DISCORD_GUILD_ID DISCORD_WEBHOOK_URL ANTHROPIC_API_KEY; do
            if [[ -n "${!var:-}" ]]; then
              # Show first 8 chars only for verification
              PREVIEW="${!var:0:8}..."
              echo "  [OK] $var (${PREVIEW})"
              FOUND=$((FOUND + 1))
            else
              echo "  [--] $var not set (will skip)"
              MISSING=$((MISSING + 1))
            fi
          done

          if [[ $FOUND -eq 0 ]]; then
            echo ""
            echo "ERROR: No secrets found in runner environment."
            echo "The HydrateSecrets.ps1 script should have set these before starting the runner."
            exit 1
          fi

          echo ""
          echo "Found $FOUND secret(s) to hydrate ($MISSING not set, will skip)."

      - name: Validate Discord token
        shell: bash
        run: |
          if [[ -z "${DISCORD_BOT_TOKEN:-}" ]]; then
            echo "DISCORD_BOT_TOKEN not set, skipping validation."
            exit 0
          fi

          echo "Validating Discord bot token..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
            "https://discord.com/api/v10/users/@me")

          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "  Token is valid."
          else
            echo "  ERROR: Token validation failed (HTTP $HTTP_CODE)."
            echo "  The token may be expired or incorrect."
            exit 1
          fi

      - name: Detect repository
        id: repo
        shell: bash
        run: |
          REPO="${{ github.repository }}"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "Target repository: $REPO"

      - name: Push secrets
        shell: bash
        run: |
          REPO="${{ steps.repo.outputs.repo }}"
          PUSHED=0

          push_secret() {
            local name="$1"
            local value="${!name:-}"
            if [[ -z "$value" ]]; then
              echo "  [--] $name: not set, skipping"
              return
            fi
            if echo "$value" | gh secret set "$name" --repo "$REPO" 2>&1; then
              echo "  [OK] $name: pushed to $REPO"
              PUSHED=$((PUSHED + 1))
            else
              echo "  [FAIL] $name: failed to push"
              exit 1
            fi
          }

          echo "Pushing secrets to $REPO..."
          echo ""

          push_secret DISCORD_BOT_TOKEN
          push_secret DISCORD_GUILD_ID
          push_secret DISCORD_WEBHOOK_URL
          push_secret ANTHROPIC_API_KEY

          echo ""
          echo "Done. Pushed $PUSHED secret(s) to $REPO."

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Hydrate Secrets Results"
            echo ""
            echo "| Secret | Status |"
            echo "|--------|--------|"
            for var in DISCORD_BOT_TOKEN DISCORD_GUILD_ID DISCORD_WEBHOOK_URL ANTHROPIC_API_KEY; do
              if [[ -n "${!var:-}" ]]; then
                echo "| $var | Pushed |"
              else
                echo "| $var | Not set (skipped) |"
              fi
            done
            echo ""
            echo "Runner: \`$(hostname)\` | Label: \`${{ github.event.inputs.runner_label }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
