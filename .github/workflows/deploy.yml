name: Deploy help-bot

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to COOLMASTER-DESK
    runs-on: [self-hosted, help-bot, deploy]
    environment: production
    # Prevent forks from running on self-hosted runner
    if: github.repository == 'game-ci/help-bot'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Node version from mise.toml
        id: node
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $mise = Get-Content mise.toml -Raw
          if ($mise -notmatch 'node\s*=\s*"([^"]+)"') {
            throw 'Could not read node version from mise.toml'
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($Matches[1])"

      - name: Install package manager (from package.json)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          corepack enable
          corepack install

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install dependencies
        shell: powershell
        env:
          YARN_ENABLE_HARDENED_MODE: "false"
        run: |
          $ErrorActionPreference = 'Stop'
          $yarnVersion = yarn --version
          if ($yarnVersion -like '1.*') {
            throw "expected up-to-date yarn version, got $yarnVersion"
          }
          yarn install --immutable

      - name: Build
        run: yarn build

      - name: Sync live tree
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deployRoot = 'C:\game-ci\help-bot'

          New-Item -ItemType Directory -Force -Path $deployRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $deployRoot 'dist') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $deployRoot 'src') | Out-Null

          robocopy "src" "$deployRoot\src" /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { throw "robocopy src failed with exit code $LASTEXITCODE" }

          robocopy "dist" "$deployRoot\dist" /MIR /R:2 /W:2 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -gt 7) { throw "robocopy dist failed with exit code $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

          foreach ($file in @('package.json', 'yarn.lock', '.yarnrc.yml', 'mise.toml', 'tsconfig.json', 'config.json', 'startup.ps1')) {
            Copy-Item -Path $file -Destination (Join-Path $deployRoot $file) -Force
          }

      - name: Repair live install
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $deployRoot = 'C:\game-ci\help-bot'
          Push-Location $deployRoot
          try {
            corepack enable
            corepack install
            yarn install --immutable
            yarn build
          } finally {
            Pop-Location
          }

      - name: Reconcile NSSM service
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'gameci-help-bot'
          $deployRoot = 'C:\game-ci\help-bot'
          $startupScript = Join-Path $deployRoot 'startup.ps1'
          $powershellPath = (Get-Command powershell).Source
          $logFile = Join-Path $deployRoot 'logs\service.log'

          New-Item -ItemType Directory -Force -Path (Join-Path $deployRoot 'logs') | Out-Null

          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if (-not $service) {
            Write-Host "Installing missing NSSM service"
            nssm install $serviceName $powershellPath "-ExecutionPolicy" "Bypass" "-File" $startupScript
          } else {
            Write-Host "Reconfiguring existing NSSM service"
            try {
              nssm stop $serviceName
            } catch {
              Write-Host "Service stop before reconfigure returned: $_"
            }
          }

          nssm set $serviceName Application $powershellPath
          nssm set $serviceName AppParameters "-ExecutionPolicy Bypass -File `"$startupScript`""
          nssm set $serviceName AppDirectory $deployRoot
          nssm set $serviceName AppStdout $logFile
          nssm set $serviceName AppStderr $logFile
          nssm set $serviceName AppStdoutCreationDisposition 1
          nssm set $serviceName AppStderrCreationDisposition 1
          nssm set $serviceName Start SERVICE_AUTO_START

      - name: Restart help-bot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            nssm restart gameci-help-bot
          } catch {
            Write-Host "NSSM restart failed, trying service start: $_"
            Start-Service -Name 'gameci-help-bot'
          }

      - name: Verify service is running
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Sleep -Seconds 8
          $svc = Get-Service -Name 'gameci-help-bot' -ErrorAction SilentlyContinue
          if ($svc.Status -ne 'Running') {
            Write-Error "Service is not running: $($svc.Status)"
            Get-Content "C:\game-ci\help-bot\logs\service.log" -Tail 30
            exit 1
          }
          $app = nssm get gameci-help-bot Application
          $args = nssm get gameci-help-bot AppParameters
          $dir = nssm get gameci-help-bot AppDirectory
          if ($app -notmatch 'powershell(\.exe)?$') {
            Write-Error "Service Application is not PowerShell: $app"
          }
          if ($args -notmatch 'startup\.ps1') {
            Write-Error "Service AppParameters do not point at startup.ps1: $args"
          }
          if ($dir.Trim() -ne 'C:\game-ci\help-bot') {
            Write-Error "Service AppDirectory is unexpected: $dir"
          }
          Write-Host "Service is running with reconciled NSSM configuration"
