name: Help Cycle

# Runs the GameCI help bot on a schedule or manual trigger.
# The bot syncs community data from Discord and GitHub, processes it with
# Claude Code to draft responses, and posts them back.

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'

  workflow_dispatch:
    # Allow manual triggering for testing
    inputs:
      dry_run:
        description: 'Dry run (skip posting responses)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      sync_hours:
        description: 'Hours of Discord history to sync'
        required: false
        default: '24'
      sync_days:
        description: 'Days of GitHub history to sync'
        required: false
        default: '7'

env:
  DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
  DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  help-cycle:
    name: Run Help Cycle
    runs-on: self-hosted

    # Prevent concurrent runs — if a cycle is still running, skip the new one
    concurrency:
      group: help-cycle
      cancel-in-progress: false

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify prerequisites
        shell: bash
        run: |
          echo "Checking required tools..."
          for cmd in curl python3 gh claude; do
            if command -v "$cmd" &>/dev/null; then
              echo "  $cmd: $(command -v $cmd)"
            else
              echo "  ERROR: $cmd not found"
              exit 1
            fi
          done
          echo ""
          echo "Checking required secrets..."
          if [[ -z "${DISCORD_BOT_TOKEN}" ]]; then echo "ERROR: DISCORD_BOT_TOKEN not set"; exit 1; fi
          if [[ -z "${DISCORD_GUILD_ID}" ]]; then echo "ERROR: DISCORD_GUILD_ID not set"; exit 1; fi
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then echo "ERROR: DISCORD_WEBHOOK_URL not set"; exit 1; fi
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then echo "ERROR: ANTHROPIC_API_KEY not set"; exit 1; fi
          echo "All prerequisites met."

      - name: Make scripts executable
        shell: bash
        run: chmod +x automation/*.sh

      - name: Run help cycle
        shell: bash
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SYNC_HOURS: ${{ github.event.inputs.sync_hours || '24' }}
          SYNC_DAYS: ${{ github.event.inputs.sync_days || '7' }}
        run: bash automation/run-help-cycle.sh

      - name: Upload response artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-cycle-responses-${{ github.run_number }}
          path: data/responses/
          retention-days: 7
          if-no-files-found: ignore
